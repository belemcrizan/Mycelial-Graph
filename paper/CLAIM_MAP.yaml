# Claim map for Paper A

Every central manuscript claim must appear here. Status vocabulary:
FROZEN_CONFIRMATORY, POST_CONFIRMATORY_DIAGNOSTIC, EXPLORATORY,
CONJECTURE, OPEN_PROBLEM, UNSUPPORTED, INTERNAL_REPRODUCTION,
INDEPENDENT_REPRODUCTION.

claims:
  - id: A-ABS
    section: Abstract
    claim: "The fixed hierarchical routing update recovered 42.1% slower than the edge-only comparator under the frozen V1 configuration; primary hypothesis REFUTED; safety gate failed. EQ-B limits representation-only attribution."
    evidence: experiments/v1/artifacts/confirmatory/CONFIRMATORY_EVIDENCE.json
    hypothesis: H1, H2
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "the tested hierarchical routing update did not improve disruption recovery relative to the edge-only comparator under the frozen V1 configuration"
    forbidden: "hierarchical pooling is universally inferior"
  - id: A-INTRO
    section: Introduction
    claim: "The scientific object is the implemented frozen comparison, not mycelial intelligence."
    evidence: experiments/v1/EXPERIMENT_PROTOCOL_V1.md
    hypothesis: H1
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "software name versus scientific phenomenon"
    forbidden: "mycelial intelligence was refuted"
  - id: A-DESIGN
    section: Experimental Design
    claim: "Paired immutable scenarios, frozen estimand delta_RRT, tau=300, N=97, rho=0.50 primary, rho=0 safety."
    evidence: experiments/v1/config.confirmatory.yaml
    hypothesis: H1, H2
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "as frozen"
    forbidden: "redesigned after seeing confirmatory outcomes"
  - id: A-PILOT
    section: Pilot
    claim: "Pilot n=20 was variance/sample-size only; point estimate -10.2%; safety already failed; disjoint from confirmatory; no retuning."
    evidence: experiments/v1/artifacts/analysis.json
    hypothesis: none confirmatory
    evidence_level: PILOT_EVIDENCE_NOT_CONFIRMATORY
    strongest_wording: "unfavourable/non-conclusive pilot signal recorded, not used to change the freeze"
    forbidden: "pilot confirmatory evidence"
  - id: A-N
    section: Sample Size
    claim: "N=97 from normal approximation on pilot paired SD 32.52."
    evidence: experiments/v1/SAMPLE_SIZE_ADDENDUM.md
    hypothesis: design
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "formula output, optional simulation-based power not performed"
    forbidden: "N is known to be correctly powered after seeing confirmatory variance"
  - id: A-FREEZE
    section: Freeze
    claim: "Protocol, analysis plan, config hash, and seed file bound before execution; no post-pilot tuning."
    evidence: experiments/v1/artifacts/CONFIRMATORY_FREEZE.json
    hypothesis: process
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "frozen"
    forbidden: "protocol amended after confirmatory outcome"
  - id: A-PRIMARY
    section: Confirmatory Results
    claim: "+42.1% (CI +11.9% to +79.1%, U +72.1%), REFUTED."
    evidence: experiments/v1/artifacts/confirmatory/analysis.json
    hypothesis: H1
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "REFUTED under the frozen mapping"
    forbidden: "inconclusive" or "actually a success"
  - id: A-SAFETY
    section: Safety Gate
    claim: "U +16.3% > +10%; NEGATIVE_TRANSFER_NOT_EXCLUDED."
    evidence: experiments/v1/artifacts/confirmatory/analysis.json
    hypothesis: H2
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "safety gate failed"
    forbidden: "negative transfer proved in general"
  - id: A-VAR
    section: Post-Confirmatory Diagnostics
    claim: "Paired-difference SD ratio confirmatory/pilot = 1.72x, not 4.54x."
    evidence: experiments/v1/artifacts/diagnostics/variance.json
    hypothesis: none
    evidence_level: POST_CONFIRMATORY_DIAGNOSTIC
    strongest_wording: "small pilot variance estimate was unstable in this environment"
    forbidden: "general law that pilots cannot estimate variance"
  - id: A-EQ
    section: Equalization Triage
    claim: "EQ-B. Warm-up path-entropy fraction 0.629 vs 0.969; selected-score std ratio 12.08."
    evidence: experiments/v1/artifacts/diagnostics/equalization.json
    hypothesis: none
    evidence_level: POST_CONFIRMATORY_DIAGNOSTIC
    strongest_wording: "comparison of implemented methods, not an isolated representation test"
    forbidden: "V1 proved that score scale caused the refutation"
  - id: A-CENS
    section: Censoring
    claim: "Non-administrative censoring 0; 1/97 hierarchical administrative at rho=0.50."
    evidence: experiments/v1/artifacts/diagnostics/censoring.json
    hypothesis: H10
    evidence_level: POST_CONFIRMATORY_DIAGNOSTIC
    strongest_wording: "censoring does not explain the primary relative-mean effect"
    forbidden: "replace RRT with an uncensored outcome as V1 primary"
  - id: A-DYN
    section: Dynamic-Range Diagnostic
    claim: "At rho=1, RRT -8.9% with U +10.2% (not below 0); regret still worse for hierarchical; sign disagreement."
    evidence: experiments/v1/artifacts/diagnostics/dynamic_range.json
    hypothesis: H7
    evidence_level: POST_CONFIRMATORY_DIAGNOSTIC
    strongest_wording: "no detectable sharing advantage under the frozen one-sided rule at rho=1"
    forbidden: "overwrite REFUTED" or "rho-star located"
  - id: A-THREAT
    section: Threats to Validity
    claim: "Synthetic data, EQ-B, limited dynamic range, small pilot, thresholded RRT, no independent reproduction, no theorem."
    evidence: paper/tmlr/paper.tex
    hypothesis: none
    evidence_level: POST_CONFIRMATORY_DIAGNOSTIC
    strongest_wording: "bounded negative result"
    forbidden: "threats are negligible"
  - id: A-ATTR
    section: Threats to Validity
    claim: "Attribution of the V1 performance difference to hierarchical representation alone; effective policy scale was not equalized in the frozen comparison."
    evidence: experiments/v1/artifacts/diagnostics/equalization.json
    hypothesis: none
    evidence_level: UNSUPPORTED
    strongest_wording: "EQ-B limits representation-only attribution; REFUTED still applies to the complete frozen mechanism"
    forbidden: "hierarchical representation caused the loss"
  - id: A-REL
    section: Related Work
    claim: "Positioning against non-stationary, structured, hierarchical, and master-algorithm literature; adaptive pooling not tested."
    evidence: paper/tmlr/references.bib
    hypothesis: none
    evidence_level: EXPLORATORY
    strongest_wording: "related, not tested"
    forbidden: "we beat CORRAL" or "we tested adaptive pooling"
  - id: A-LIM
    section: Limitations
    claim: "Paper A does not solve the failure."
    evidence: paper/tmlr/paper.tex
    hypothesis: none
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "report the frozen test"
    forbidden: "post-hoc rescue as confirmatory"
  - id: A-REPRO
    section: Reproducibility
    claim: "Sealed decision CPU 0.122 CPU-hours (437.59375 s) from raw decision_cpu_seconds over 1940 trials. Full replay wall-clock 403.8 s / decision CPU 0.269 CPU-hours is a different metric. Internal reproduction only."
    evidence: research/runtime.json
    hypothesis: none
    evidence_level: INTERNAL_REPRODUCTION
    strongest_wording: "internal / automated"
    forbidden: "independently reproduced"
  - id: A-CONC
    section: Conclusion
    claim: "REFUTED, with diagnostics disclosed, without converting diagnostics into confirmatory evidence."
    evidence: experiments/v1/artifacts/confirmatory/CONFIRMATORY_EVIDENCE.json
    hypothesis: H1, H2
    evidence_level: FROZEN_CONFIRMATORY
    strongest_wording: "bounded negative result"
    forbidden: "the method works once equalized"
