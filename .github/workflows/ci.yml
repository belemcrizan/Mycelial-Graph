name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: git diff --check
      - run: python -m pytest
      - run: mycelial-graph validate --config experiments/v1/config.development.yaml
      - run: mycelial-graph v2-validate --config experiments/v2/config.development.yaml
      - run: mycelial-graph v2-validate --config experiments/v2_1/config.development.yaml
      - run: mycelial-graph claim-audit --matrix docs/claim_evidence_matrix.yaml
      - run: mycelial-graph validate --config experiments/v1/config.confirmatory.yaml
      - run: python scripts/audit_v1_readiness.py
      - run: python reproduce_confirmatory.py
      - run: mycelial-graph real-smoke
      - run: python scripts/reproduce_v1.py --output outputs/ci-v1 --workers 2
      - run: python -m mycelial_graph verify-seal --output outputs/ci-v1

  integrity:
    name: confirmatory integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: git diff --check
      - run: python -m pytest tests/test_v1_reproduction_integrity.py tests/test_v1_confirmatory_integrity.py tests/test_scientific_state.py tests/test_evidence_integrity.py
      - run: python reproduce_confirmatory.py
