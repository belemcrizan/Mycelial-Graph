name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: mycelial-graph validate --config experiments/v1/config.development.yaml
      - run: mycelial-graph v2-validate --config experiments/v2/config.development.yaml
      - run: python scripts/reproduce_v1.py --output outputs/ci-v1 --workers 2
      - run: python -m mycelial_graph verify-seal --output outputs/ci-v1
