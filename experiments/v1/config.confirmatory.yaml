# EXECUTION LOCK: this configuration intentionally references a file that is
# created only after the independent pilot fixes N in SAMPLE_SIZE_ADDENDUM.md.
protocol_version: MG-EXP-V1
experiment_id: MG-EXP-V1-CONFIRMATORY
run_kind: confirmatory

graph:
  internal_layers: 3
  alternatives_per_layer: 3

horizon:
  pre_shock_steps: 200
  post_shock_steps: 300
  recovery_trailing_window: 10
  recovery_confirmation_window: 20
  recovery_utility_fraction: 0.90

environment:
  rho_values: [0.0, 0.25, 0.5, 0.75, 1.0]
  shock_magnitude: 0.55
  reward_noise_std: 0.04
  optimum_margin: 0.002
  max_generation_attempts: 10000

mycelial:
  initial_conductance: 0.50
  minimum_conductance: 0.01
  maximum_conductance: 2.00
  learning_rate: 0.22
  node_learning_rate: 0.14
  interaction_learning_rate: 0.10
  temporal_decay: 0.015
  exploration_probability: 0.08
  exploration_reinforcement: 0.0
  temperature: 0.20
  shrinkage: 0.002

structured_sw_ucb:
  window_size: 200
  ridge: 1.0
  uncertainty_bonus: 0.35

analysis:
  bootstrap_samples: 10000
  confidence_level: 0.95
  superiority_alpha: 0.05
  engineering_gain_gate: 0.20
  noninferiority_margin: 0.10
  primary_rho: 0.5

methods:
  - edge_only
  - node_only
  - hierarchical
  - structured_sw_ucb

seeds_file: seeds.confirmatory.txt

