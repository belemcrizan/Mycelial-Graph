# MG-EXP-V1.5 equalized re-run configuration.
# FROZEN, NOT AUTHORIZED. A runner MUST refuse to execute while authorized == false.
# This file exists to be reviewed and, by a human decision, authorized. It cannot run on its own.
# See experiments/v1_5/PROTOCOL_EQUALIZED_RERUN.md and research/diagnostics/EQ_B_REPORT.md.

schema_version: 1
status: frozen
authorized: false
authorized_by: null
authorized_at: null

protocol_version: MG-EXP-V1_5
experiment_id: MG-EXP-V1_5-EQUALIZED
run_kind: equalized_rerun

# --- Provenance / gate binding ------------------------------------------------
motivating_diagnostic: research/diagnostics/EQ_B_REPORT.md
equalization_source: experiments/v1/artifacts/diagnostics/equalization.json
requires_human_gates:
  - MASTER_PROMPT#5.2  # authorize equalized re-run
  - MASTER_PROMPT#5.5  # moratorium amendment in force
amendment_proposal: experiments/PROTOCOL_AMENDMENT_002_PROPOSAL.md
does_not_alter: experiments/v1/artifacts/CONFIRMATORY_FREEZE.json  # V1 REFUTED stays sealed

# --- Inherited (identical to V1 confirmatory) --------------------------------
graph:
  internal_layers: 3
  alternatives_per_layer: 3

horizon:
  pre_shock_steps: 200
  post_shock_steps: 300
  recovery_trailing_window: 10
  recovery_confirmation_window: 20
  recovery_utility_fraction: 0.90

environment:
  rho_values: [0.0, 0.25, 0.5, 0.75, 1.0]
  shock_magnitude: 0.55
  reward_noise_std: 0.04
  optimum_margin: 0.002
  max_generation_attempts: 10000

analysis:
  bootstrap_samples: 10000
  confidence_level: 0.95
  superiority_alpha: 0.05
  engineering_gain_gate: 0.20
  noninferiority_margin: 0.10
  primary_rho: 0.5

methods:
  - edge_only
  - hierarchical

# --- The V1.5 addition: effective-policy-scale equalization -------------------
# Calibrated on development seeds ONLY, then frozen. No per-confirmatory-seed tuning.
# Scaling constants below are placeholders (null); they MUST be filled by the frozen
# calibration procedure and re-frozen BEFORE any confirmatory seed is drawn or run.
equalization:
  measured_from: full_candidate_score_traces   # re-instrumented; not selected-edge-only
  targets:
    path_entropy_fraction_match_tol: 0.05
    selected_score_std_ratio_max: 2.0
    exploration_step_rate_match_tol: 0.05
  feedback_contract: local traversed-edge rewards only
  calibration:
    calibrated_on: seeds.development.txt
    edge_only_score_scale: null
    hierarchical_score_scale: null
    calibration_frozen: false   # becomes true only after dev-seed calibration is sealed

# --- Sample size: MUST be derived pre-execution from an equalized pilot -------
# Do NOT copy N=97 from V1; equalized arms may have different paired variance.
sample_size_n: null
sample_size_addendum: null   # e.g. experiments/v1_5/SAMPLE_SIZE_ADDENDUM.md (to be written)

# --- Seeds: new, sealed, disjoint from all V1 seed sets -----------------------
# No seed file is generated until authorized. This records the rule only.
seeds_file: null
seeds_pool_file: null
seeds_disjoint_from:
  - experiments/v1/seeds.confirmatory.txt
  - experiments/v1/seeds.pilot.txt
  - experiments/v1/seeds.development.txt
