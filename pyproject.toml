[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelial-graph"
version = "0.2.0"
description = "A reproducible research framework for local adaptation, structural reuse, and resource allocation in dynamic AI execution graphs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Crizan Belem Ribeiro"}]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.scripts]
mycelial-graph = "mycelial_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

