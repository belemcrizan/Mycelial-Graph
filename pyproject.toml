[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelial-graph"
version = "0.0.0"
description = "V0 demonstrator for local adaptation in dynamic AI execution graphs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Crizan Belém Ribeiro"}
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
mycelial-graph = "mycelial_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
